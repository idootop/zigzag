[package]
name = "zigzag"
version = "0.1.0"
description = "本地归档多媒体批量压缩工具"
authors = ["Del Wang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zigzag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.20"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.2"
ts-rs = "12.0.1"
jwalk = "0.9.0"
libc = "0.2.189"
imagesize = "0.15.0"
libavif-sys = { version = "0.17.0", default-features = false, features = ["codec-aom"] }
# 只开手机与相机高频产出的四种格式（D-52 / D-60）。TIFF / BMP 已出局；
# TGA / PNM / DDS / QOI / farbfeld 是设计与游戏工具链的中间产物，照片库里不会有；
# EXR / HDR 是浮点高动态格式，同理。
# 默认 features 还会拖进 ravif（AVIF 编码走 libavif，用不上）。
# HEIC / RAW / AVIF 的解码另走 ImageIO（D-14），不在这里。
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
fast_image_resize = "6.1.0"
kamadak-exif = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
objc2-image-io = "0.3.2"

